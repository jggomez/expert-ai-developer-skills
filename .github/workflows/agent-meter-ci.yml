name: agent-meter CI

on:
  push:
    branches: [main]
    paths: ["tools/agent-meter/**", ".github/workflows/agent-meter-*.yml"]
  pull_request:
    paths: ["tools/agent-meter/**", ".github/workflows/agent-meter-*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    defaults:
      run:
        working-directory: tools/agent-meter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --python 3.12 --extra dev
      - run: uv run ruff check src tests packaging
        if: runner.os == 'Linux'
      - run: uv run mypy src
        if: runner.os == 'Linux'
      - run: uv run pytest tests -q
