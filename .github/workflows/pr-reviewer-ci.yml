name: pr-reviewer CI

on:
  pull_request:
    paths: ["tools/pr-reviewer/**", ".github/workflows/pr-reviewer-ci.yml"]
  push:
    branches: [main]
    paths: ["tools/pr-reviewer/**", ".github/workflows/pr-reviewer-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/pr-reviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/pr-reviewer/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen --extra dev --extra antigravity --extra claude
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest -q
