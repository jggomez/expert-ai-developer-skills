[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pr-reviewer"
version = "0.1.0"
description = "AI pull request reviewer focused on efficient, optimal and cheap-to-run code. Runs as a GitHub Action."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "jggomez" }]
keywords = ["code-review", "github-actions", "pull-request", "antigravity", "claude", "llm"]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
antigravity = ["google-antigravity==0.1.23"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0"]

[project.scripts]
pr-reviewer = "pr_reviewer.entrypoints.cli:main"

[project.urls]
Homepage = "https://github.com/jggomez/expert-ai-developer-skills/tree/main/tools/pr-reviewer"
Source = "https://github.com/jggomez/expert-ai-developer-skills"
Issues = "https://github.com/jggomez/expert-ai-developer-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
