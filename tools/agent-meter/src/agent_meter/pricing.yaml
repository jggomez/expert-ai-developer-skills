# agent-meter shipped price table — USD per 1M tokens, standard first-party API rates.
# Seeded ONLY from docs/agent-metrics/pricing-sources.md (fetched 2026-10-16). Never edit from
# memory: refresh by re-fetching the source URLs. User overrides belong in
# ~/.agent-meter/pricing.local.yaml (local always wins). Money values are quoted strings.
# Tiers: "prompt > N tokens" is encoded as min_prompt_tokens: N + 1 (prompt = input + cache
# reads + cache writes). Missing cache_write_* prices fall back to the input price (Gemini has
# no cache-write premium). Fast-mode rows are not shipped: the source gives no cache prices for
# them, so speed == "fast" falls back to the base row flagged as estimated.
